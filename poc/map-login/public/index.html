<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapLogin.wz Browser PoC</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #080d16;
      color: #e8f3ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 0%, #18304a 0, transparent 45rem),
        #080d16;
    }

    main {
      width: min(897px, 100%);
      padding: 16px 24px 24px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 650;
    }

    p {
      margin: 4px 0 0;
      color: #a9bfd3;
      font-size: 0.78rem;
    }

    #status {
      min-width: 10rem;
      text-align: right;
      font: 0.72rem ui-monospace, monospace;
      color: #8fd7ff;
    }

    #viewport {
      width: 100%;
      height: min(78vh, 720px);
      min-height: 360px;
      overflow: auto;
      overscroll-behavior: contain;
      touch-action: pan-y;
      background: #050a11;
      border: 1px solid #304a62;
      border-radius: 4px;
      box-shadow: 0 18px 54px #000a;
      scrollbar-color: #6a91ad #101923;
    }

    #viewport:focus-visible {
      outline: 2px solid #8fd7ff;
      outline-offset: 3px;
    }

    #scroll-space {
      position: relative;
      width: 100%;
    }

    #scene {
      position: sticky;
      top: 0;
      display: block;
      width: 100%;
      background: #050a11;
    }

    #fatal {
      display: none;
      padding: 24px;
      color: #ffb6b6;
      white-space: pre-wrap;
    }

    @media (max-width: 560px) {
      main {
        padding: 10px;
      }

      header {
        align-items: start;
        flex-direction: column;
      }

      #status {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>MapLogin.img · KMS v1.2.43</h1>
        <p>휠, 스크롤바 또는 터치로 전체 로그인 맵을 직접 이동하세요.</p>
      </div>
      <div id="status" aria-live="polite">WZ 장면을 불러오는 중…</div>
    </header>
    <div id="viewport" tabindex="0" aria-label="스크롤 가능한 메이플스토리 로그인 맵">
      <div id="scroll-space">
        <canvas id="scene"></canvas>
        <pre id="fatal"></pre>
      </div>
    </div>
  </main>
  <script src="scene-utils.js"></script>
  <script src="app.js"></script>
</body>
</html>
