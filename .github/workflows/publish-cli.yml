name: Publish CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag
        run: node scripts/verify-release-tag.mjs "$GITHUB_REF_NAME"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify package contents
        run: |
          npm pack --dry-run --json --ignore-scripts --silent > "$RUNNER_TEMP/maple-hatch-pack.json"
          node scripts/verify-package-contents.mjs "$RUNNER_TEMP/maple-hatch-pack.json"

      - run: npm publish --access public
